<!doctype html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Employees')}"></head>
<body class="page-list">

<header th:replace="~{fragments :: header(@{/employees/new(page=${currentPage})})}"></header>

<div th:replace="~{fragments :: flash}"></div>

<!-- ===================== Table ===================== -->
<main class="app-main">
    <div class="table-card">
        <div class="table-scroll">
            <table class="table employee-table">
                <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th>First name</th>
                    <th>Last name</th>
                    <th class="col-dob">Date of birth</th>
                    <th class="col-actions">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${employees.isEmpty()}">
                    <td colspan="5" class="text-center text-secondary py-5">No employees found</td>
                </tr>
                <tr th:each="employee : ${employees}">
                    <td class="col-id" th:text="${employee.id}">1</td>
                    <td th:text="${employee.firstName}">James</td>
                    <td th:text="${employee.lastName}">Smith</td>
                    <td class="col-dob" th:text="${employee.dateOfBirth}">1985-03-14</td>
                    <td class="col-actions">
                        <a class="btn btn-sm btn-outline-primary" title="Edit"
                           th:href="@{/employees/{id}/edit(id=${employee.id}, page=${currentPage})}"><i class="bi bi-pencil"></i></a>
                        <button type="button" class="btn btn-sm btn-outline-danger ms-1" title="Delete"
                                data-bs-toggle="modal" data-bs-target="#deleteModal"
                                th:data-id="${employee.id}"
                                th:data-name="${employee.fullName}"
                                th:data-action="@{/employees/{id}/delete(id=${employee.id})}"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- ===================== Pagination (fixed) ===================== -->
<footer class="app-footer">
    <nav aria-label="Employee pages" th:if="${totalPages > 0}">
        <ul class="pagination">
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? 'active'"
                th:attr="aria-current=${pageNumber == currentPage} ? 'page'">
                <a class="page-link" th:href="@{/employees(page=${pageNumber})}" th:text="${pageNumber}">1</a>
            </li>
        </ul>
    </nav>
</footer>

<!-- ===================== Delete confirmation ===================== -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <!-- action is set from the clicked button's data-action -->
        <form class="modal-content" method="post" data-delete-form>
            <input type="hidden" name="page" th:value="${currentPage}">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">
                    <i class="bi bi-exclamation-triangle text-danger me-2"></i>Delete employee
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete <strong data-delete-name></strong>
                <span class="text-secondary">(ID <span data-delete-id></span>)</span>?
                This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
