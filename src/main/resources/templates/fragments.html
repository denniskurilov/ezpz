<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- ===================== <head> ===================== -->
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · EZPZ'">EZPZ</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/main.css}">

    <script th:src="@{/main.js}"></script>
</head>

<body>

<!-- ===================== Header ===================== -->
<!-- addUrl: link for the "Add employee" button, or null to hide it -->
<header class="app-header" th:fragment="header(addUrl)">
    <div class="container-fluid h-100 px-3 px-md-4 d-flex align-items-center justify-content-between">
        <a class="app-brand" th:href="@{/employees}">
            <span class="app-brand-logo"><i class="bi bi-people-fill"></i></span>
            <span>
                <span class="app-brand-title d-block">Employee Registry</span>
                <span class="app-brand-subtitle d-block">EZPZ · staff records</span>
            </span>
        </a>

        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-accent" th:if="${addUrl != null}" th:href="${addUrl}">
                <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline ms-1">Add employee</span>
            </a>
            <button type="button" class="btn btn-outline-secondary theme-toggle" data-theme-toggle
                    title="Toggle theme" aria-label="Toggle theme">
                <i data-theme-icon class="bi bi-moon-stars"></i>
            </button>
        </div>
    </div>
</header>

<!-- ===================== Flash message (toast) ===================== -->
<div class="toast-area" th:fragment="flash" th:if="${message != null}">
    <div class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true"
         th:classappend="'text-bg-' + ${messageType}">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi me-2" th:classappend="${messageType == 'success'} ? 'bi-check-circle' : 'bi-exclamation-circle'"></i>
                <span th:text="${message}">Message</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- ===================== Scripts ===================== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
