<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee · EZPZ</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="main.css">

    <script src="main.js"></script>
</head>
<body class="page-form">

<!-- ===================== Header ===================== -->
<header class="app-header">
    <div class="container-fluid h-100 px-3 px-md-4 d-flex align-items-center justify-content-between">
        <a class="app-brand" href="index.html">
            <span class="app-brand-logo"><i class="bi bi-people-fill"></i></span>
            <span>
                <span class="app-brand-title d-block">Employee Registry</span>
                <span class="app-brand-subtitle d-block">EZPZ · staff records</span>
            </span>
        </a>

        <button type="button" class="btn btn-outline-secondary theme-toggle" data-theme-toggle
                title="Toggle theme" aria-label="Toggle theme">
            <i data-theme-icon class="bi bi-moon-stars"></i>
        </button>
    </div>
</header>

<!-- ===================== Form ===================== -->
<main class="app-main overflow-auto">
    <div class="form-card p-4 p-md-5">
        <h1 class="h3 mb-4" id="pageTitle">Edit employee</h1>

        <form id="employeeForm" novalidate>
            <div class="row g-3">
                <div class="col-sm-4">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id" value="1" disabled>
                </div>
                <div class="col-sm-8">
                    <label for="createdAt" class="form-label">Created at (UTC)</label>
                    <input type="text" class="form-control" id="createdAt" name="createdAt" value="2026-10-27 14:32:05" disabled>
                </div>

                <div class="col-12">
                    <label for="firstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" value="James"
                           maxlength="100" required>
                    <div class="invalid-feedback">First name is required.</div>
                </div>

                <div class="col-12">
                    <label for="lastName" class="form-label">Last name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" value="Smith"
                           maxlength="100" required>
                    <div class="invalid-feedback">Last name is required.</div>
                </div>

                <div class="col-12">
                    <label for="dateOfBirth" class="form-label">Date of birth</label>
                    <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" value="1985-03-14">
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary px-4"
                        data-bs-toggle="modal" data-bs-target="#cancelModal">Cancel</button>
                <button type="submit" class="btn btn-accent px-4">
                    <i class="bi bi-check-lg me-1"></i>Save
                </button>
            </div>
        </form>
    </div>
</main>

<!-- ===================== Cancel confirmation ===================== -->
<div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cancelModalLabel">Discard changes?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Any unsaved changes will be lost. Do you want to leave this page?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Stay</button>
                <button type="button" class="btn btn-danger" id="confirmCancel">Discard</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
